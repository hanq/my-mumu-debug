<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}svg{display:block}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- bg: muted teal -->
  <rect width="1024" height="1024" fill="#3E8689"/>
  <!-- ears: rounded-tip cat triangles (base hidden under head) -->
  <path d="M 280 312 Q 272 195 312 152 Q 368 168 396 236 Z" fill="#F2913D" stroke="#F2913D" stroke-width="36" stroke-linejoin="round"/>
  <path d="M 300 285 Q 296 205 320 180 Q 350 192 368 240 Z" fill="#FDF0D5" stroke="#FDF0D5" stroke-width="14" stroke-linejoin="round"/>
  <path d="M 660 312 Q 668 195 628 152 Q 572 168 544 236 Z" fill="#F2913D" stroke="#F2913D" stroke-width="36" stroke-linejoin="round"/>
  <path d="M 640 285 Q 644 205 620 180 Q 590 192 572 240 Z" fill="#FDF0D5" stroke="#FDF0D5" stroke-width="14" stroke-linejoin="round"/>
  <!-- one continuous silhouette: head + body -->
  <circle cx="470" cy="460" r="250" fill="#F2913D"/>
  <ellipse cx="500" cy="790" rx="290" ry="260" fill="#F2913D"/>
  <!-- face + belly patches -->
  <ellipse cx="470" cy="540" rx="190" ry="140" fill="#FDF0D5"/>
  <ellipse cx="500" cy="860" rx="160" ry="120" fill="#FDF0D5"/>
  <!-- eyes / nose / tiny smile -->
  <circle cx="395" cy="495" r="22" fill="#4A2C17"/>
  <circle cx="545" cy="495" r="22" fill="#4A2C17"/>
  <circle cx="470" cy="540" r="12" fill="#4A2C17"/>
  <path d="M 448 562 Q 470 578 492 562" fill="none" stroke="#4A2C17" stroke-width="10" stroke-linecap="round"/>
  <!-- arm reaching to lens (behind lens) -->
  <ellipse cx="580" cy="720" rx="90" ry="55" fill="#F2913D"/>
  <!-- magnifier: handle behind rim, rim, pale lens -->
  <line x1="768" y1="888" x2="872" y2="992" stroke="#4A2C17" stroke-width="64" stroke-linecap="round"/>
  <circle cx="680" cy="800" r="130" fill="#4A2C17"/>
  <circle cx="680" cy="800" r="96" fill="#FFF6E4"/>
  <!-- paw gripping the rim (over lens, connected to arm) -->
  <circle cx="652" cy="704" r="44" fill="#F2913D"/>
</svg>
</body>
</html>
