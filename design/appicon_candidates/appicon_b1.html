<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}svg{display:block}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- bg: muted teal -->
  <rect width="1024" height="1024" fill="#3E8689"/>
  <!-- ears (paired, rounded) -->
  <circle cx="285" cy="272" r="80" fill="#F2913D"/>
  <circle cx="285" cy="282" r="42" fill="#FDF0D5"/>
  <circle cx="615" cy="272" r="80" fill="#F2913D"/>
  <circle cx="615" cy="282" r="42" fill="#FDF0D5"/>
  <!-- one continuous silhouette: head + body, same fill -->
  <circle cx="450" cy="490" r="265" fill="#F2913D"/>
  <ellipse cx="470" cy="800" rx="310" ry="290" fill="#F2913D"/>
  <!-- face + belly patches (2 internal color regions) -->
  <ellipse cx="450" cy="565" rx="205" ry="150" fill="#FDF0D5"/>
  <ellipse cx="390" cy="870" rx="170" ry="135" fill="#FDF0D5"/>
  <!-- eyes / nose / tiny mouth -->
  <circle cx="365" cy="505" r="24" fill="#5D3A1F"/>
  <circle cx="535" cy="505" r="24" fill="#5D3A1F"/>
  <circle cx="450" cy="548" r="13" fill="#5D3A1F"/>
  <path d="M425 574 Q450 592 475 574" fill="none" stroke="#5D3A1F" stroke-width="11" stroke-linecap="round"/>
  <!-- magnifying glass: handle behind, rim, flat pale lens -->
  <line x1="745" y1="925" x2="905" y2="1085" stroke="#5D3A1F" stroke-width="92" stroke-linecap="round"/>
  <circle cx="640" cy="820" r="196" fill="#5D3A1F"/>
  <circle cx="640" cy="820" r="152" fill="#FFF8E8"/>
  <!-- paws gripping the rim -->
  <circle cx="475" cy="742" r="58" fill="#F2913D"/>
  <circle cx="795" cy="742" r="58" fill="#F2913D"/>
</svg>
</body>
</html>
